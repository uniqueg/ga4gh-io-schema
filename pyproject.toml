[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ga4gh-io-schema"
version = "0.1.0"
description = "GA4GH standard profile for workflow and tool inputs and outputs"
readme = "README.md"
# Keep in sync with the CI test matrix and ruff's target-version.
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    # "format-nongpl" enables format checks (e.g. "uri") without GPL-licensed
    # extras; don't switch to "format", which pulls in rfc3987 (GPL-3.0).
    "jsonschema[format-nongpl]>=4.21.1",
    "referencing>=0.31.0",
]

[project.scripts]
ga4gh-io-schema = "ga4gh_io_schema.cli:main"

[project.optional-dependencies]
# The CWL converter (`ga4gh-io-schema convert cwl`)
cwl = ["cwl-utils>=0.47"]
dev = [
    "build>=1.2.1",
    # For the tests of the CWL converter; keep in sync with `cwl`
    "cwl-utils>=0.47",
    "pytest>=8.1.1",
    "pytest-cov>=5.0.0",
    "check-jsonschema>=0.28.1",
    "reuse>=3.0.2",
    "ruff>=0.4.0",
]
# The documentation (`mkdocs.yml`), built by Read the Docs
# (`.readthedocs.yaml`) and CI's `docs` job; the plugins of MkDocs are
# listed too, to bound their major versions (new warnings of minor releases
# still fail the strict build)
docs = [
    "griffelib>=2.4,<3",
    "mkdocs>=1.6.1,<2",
    "mkdocs-autorefs>=1.4.4,<2",
    "mkdocs-material>=9.7.7,<10",
    "mkdocstrings>=1.0.8,<2",
    "mkdocstrings-python>=2.0.10,<3",
    "pymdown-extensions>=12.3,<13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ga4gh_io_schema"]

# Ship the schemas as package data; the repository keeps them in schemas/.
[tool.hatch.build.targets.wheel.force-include]
"schemas" = "ga4gh_io_schema/schemas"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov --cov-report=term-missing"
markers = [
    "wheel: builds and installs the wheel (needs network access)",
]

[tool.coverage.run]
source = ["ga4gh_io_schema"]
branch = true

[tool.coverage.report]
fail_under = 100

[tool.ruff]
line-length = 88
# Lowest supported Python version (see requires-python).
target-version = "py311"

[tool.ruff.lint]
# D: pydocstyle, E: pycodestyle, F: pyflakes, I: isort
select = ["D", "E", "F", "I"]
# Ignore line length errors in linting if formatting handles it
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.pydocstyle]
convention = "google"
