name: CI

on:
  push:
    branches: ["main", "v*"]
  # All pull requests, also those into release branches (e.g., `v0.3`)
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check license compliance (REUSE)
        run: reuse lint

      - name: Lint Markdown documentation
        run: npx markdownlint-cli "**/*.md" --ignore "node_modules"

      - name: Check code formatting (Ruff)
        run: ruff format --check .

      - name: Lint Python code (Ruff)
        run: ruff check .

      - name: Validate GA4GH Meta-Schema syntax
        run: |
          check-jsonschema --check-metaschema schemas/ga4gh-io-profile.schema.json
          check-jsonschema --check-metaschema schemas/vocabularies/ui-widgets.schema.json

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Lowest to newest supported version; keep in sync with pyproject.toml.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify package build (sdist and wheel)
        run: python -m build

      - name: Run tests (including installed wheel)
        run: pytest

      - name: E2E CLI Validation (Valid Schemas)
        run: |
          ga4gh-io-schema-validator tests/data/valid.schema.json
          ga4gh-io-schema-validator tests/data/example_workflow.schema.json
          ga4gh-io-schema-validator tests/data/example_tool.schema.json

      - name: E2E CLI Validation (Invalid Schemas)
        run: |
          ! ga4gh-io-schema-validator tests/data/invalid.schema.json

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Python version of Read the Docs (`.readthedocs.yaml`)
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      # Fails on warnings, e.g., of broken links, anchors and references
      - name: Build documentation
        run: mkdocs build --strict

  # The only required check: fails unless every job succeeded (a skipped or
  # cancelled job fails it too).
  passed:
    name: CI passed
    needs: [lint, test, docs]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results of all jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              exit 1
            fi
          done
