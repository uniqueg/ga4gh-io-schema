id: text-without-encoding
valid:
  - open(path, encoding="utf-8")
  - open(path, "w", encoding="utf-8")
  - open(path, mode, encoding="utf-8")
  - open(path, "rb")
  - open(path, "r+b")
  - open(path, "br")
  - open(path, "ab")
  - open(path, mode="wb")
  - path.read_text(encoding="utf-8")
  - path.write_text(text, encoding="utf-8")
  - path.read_text("utf-8")
  - path.write_text(text, "utf-8")
  - path.read_bytes()
invalid:
  - open(path)
  - open(path, "r")
  - open(path, "w")
  - open(path, mode="w")
  - open("b.json")
  # Strings and keyword arguments nested in the arguments don't count
  - open(os.path.join(directory, "rb"))
  - open(name("rb"))
  - open(path, mode=choose(encoding="utf-8"))
  - path.read_text()
  - path.write_text(text)
