# Semgrep rules for security issues of this project that ruff's rules don't
# cover; secrets are detected by gitleaks (cf. `.pre-commit-config.yaml`).
# Test cases: `ga4gh-io-schema.py` next to this file (`semgrep --test`)
rules:
  - id: yaml-load-without-safe-loader
    languages: [python]
    severity: ERROR
    message: >-
      Descriptors and schemas are untrusted input; `yaml.load` with a full
      loader can construct arbitrary Python objects. Use `yaml.safe_load`
    patterns:
      - pattern-either:
          - pattern: yaml.load(...)
          - pattern: yaml.load_all(...)
          - pattern: yaml.unsafe_load(...)
          - pattern: yaml.unsafe_load_all(...)
          - pattern: yaml.full_load(...)
          - pattern: yaml.full_load_all(...)
      - pattern-not: yaml.$LOAD($S, Loader=yaml.SafeLoader, ...)
      - pattern-not: yaml.$LOAD($S, Loader=yaml.CSafeLoader, ...)
      - pattern-not: yaml.$LOAD($S, yaml.SafeLoader, ...)
      - pattern-not: yaml.$LOAD($S, yaml.CSafeLoader, ...)
  - id: urlopen-without-timeout
    languages: [python]
    severity: ERROR
    message: >-
      Requests to other services (TRS, WES, descriptor URLs) need a timeout,
      so that a slow or hostile server can't block the caller; pass
      `timeout=`
    patterns:
      - pattern-either:
          - pattern: urllib.request.urlopen(...)
          - pattern: urlopen(...)
      - pattern-not: urllib.request.urlopen(..., timeout=$T, ...)
      - pattern-not: urlopen(..., timeout=$T, ...)
      # Positional timeout (the third argument)
      - pattern-not: urllib.request.urlopen($U, $D, $T, ...)
      - pattern-not: urlopen($U, $D, $T, ...)
