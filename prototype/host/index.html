<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>I/O Schema form (proof of concept)</title>
    <link rel="stylesheet" href="form.css">
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <header class="masthead">
      <div class="masthead-inner">
        <p class="brand">GA4GH I/O Schema <span class="brand-tag">Live demo</span></p>
        <p hidden class="picker">
          <label for="workflow">Workflow in TRS</label>
          <select id="workflow"></select>
        </p>
      </div>
    </header>
    <main>
      <p class="poc">
        Proof of concept of the GA4GH I/O Schema proposal, not a product.
        <span id="wes"></span>
      </p>
      <div class="panels">
        <section class="card workflow" aria-labelledby="title">
          <h1 id="title"></h1>
          <p id="description"></p>
          <io-schema-form></io-schema-form>
        </section>
        <section class="card request" aria-labelledby="request-heading">
          <h2 id="request-heading">WES run request</h2>
          <pre id="request">(submit the form)</pre>
          <button type="button" id="submit-run" hidden>Send to WES</button>
          <p id="run" class="run"></p>
        </section>
      </div>
    </main>
  </body>
</html>
