# The prototype on a single laptop (a proof of concept, not a product): the
# TRS stub serves the demo workflow and its IO schema, and the host lets
# users pick the workflow in the stub, fill in its form and see the WES run
# request. See docs/adoption/prototype.md.
#
#   docker compose -f prototype/compose.yaml up --build
#
# Then open http://127.0.0.1:8000/. Optional settings, from the environment:
#
# - WES_URL: base URL of a WES API to send run requests to (e.g.,
#   https://wes.example.org/ga4gh/wes/v1); without it, nothing is sent.
# - TRS_URL: base URL of another TRS API to pick workflows from (default:
#   the stub). A WES must be able to fetch workflows from it: the stub is
#   reachable only from the host.

name: io-schema-prototype

x-image: &image
  build:
    context: ..
    dockerfile: prototype/Dockerfile
  image: io-schema-prototype:local
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  trs-stub:
    <<: *image
    command: ["python", "prototype/trs-stub/trs_stub.py", "--host", "0.0.0.0"]
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ga4gh/trs/v2/tools')"
      interval: 2s
      timeout: 5s
      retries: 15

  host:
    <<: *image
    command: >-
      python prototype/host/form_host.py --host 0.0.0.0
      --trs-url ${TRS_URL:-http://trs-stub:8080/ga4gh/trs/v2}
      ${WES_URL:+--wes-url ${WES_URL}}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      trs-stub:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')"
      interval: 2s
      timeout: 5s
      retries: 15
