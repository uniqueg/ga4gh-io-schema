# Default markdownlint configuration
default: true

# Exclude line length rule (MD013) because it breaks on long URLs and tables
MD013: false

# Allow duplicate headings (MD024) if they are nested under different parents
MD024:
  siblings_only: true

# Allow inline HTML (MD033) for SPDX license comments and custom GA4GH widget docs
MD033: false
